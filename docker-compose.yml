# This file is both:
#  - the "day 0" stack you bring up manually the first time you set up a Pi
#  - the same shape of file Blynk OTA pushes later to update the stack
#
# Convention: on the Pi, runtime state (this file once deployed, backups,
# blynk.env, the rendered mqtt-bridge config) lives at /opt/blynk, and
# /opt/blynk is bind-mounted 1:1 (identical absolute path on both sides)
# into the agent container. That's required because the agent drives the
# HOST's Docker daemon over the socket - any bind-mount path it uses only
# resolves correctly on that daemon if it's a real host path, not a path
# that only means something inside the agent's own container.
#
# `build:` is kept alongside `image:` so a local checkout can still build
# (`docker compose build`) - but an OTA push is just this YAML text with no
# source tree attached, so what actually matters for OTA is that `image:`
# points at something already sitting in a registry (ghcr.io here, built
# and pushed by .github/workflows/build-and-push.yml). Bump both this
# version and the image tags together - never reuse a version number for
# different image content.

name: blynk

x-stack:
  version: "2.6.0"

services:
  mqtt-bridge:
    build: ./mqtt-bridge
    image: ghcr.io/anthony-blynk/blynk-mqtt-bridge:2.6.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - /opt/blynk/mqtt-bridge/conf.d:/mosquitto/config/conf.d
      - mqtt_bridge_data:/mosquitto/data
      - mqtt_bridge_log:/mosquitto/log

  agent:
    build: ./agent
    image: ghcr.io/anthony-blynk/blynk-agent:2.6.0
    restart: unless-stopped
    depends_on:
      - mqtt-bridge
    privileged: true
    pid: "host"
    environment:
      - BLYNK_CONFIG_DIR=/opt/blynk
      - MQTT_HOST=mqtt-bridge
      - MQTT_PORT=1883
      # On by default for now, so the remote-terminal feature is obvious
      # and easy to try - see the README's "Remote terminal" section. Turn
      # this off before deploying to a production fleet. This is a
      # capability gate, not the on/off control: a console Switch widget
      # bound to AgentTerminalEnabled is still required too. Set to false
      # (or remove this line) to turn the capability off for a device
      # entirely - at that point no Switch toggle can turn it back on
      # without an OTA push or a manual edit here.
      - AGENT_TERMINAL_ENABLED=true
      # Off by default, unlike Terminal above - this one needs real,
      # non-trivial Blynk-side setup first (an Enterprise org, "Enable for
      # Gateway API" turned on for this device's own template) plus an
      # AgentSubDeviceRegistry datastream value, before it does anything at
      # all, so there's no equivalent "safe to turn on and just try it"
      # case. See the README's "MQTT Gateway" section.
      - AGENT_GATEWAY_ENABLED=false
    volumes:
      - /opt/blynk:/opt/blynk
      - /var/run/docker.sock:/var/run/docker.sock
      # BLE provisioning talks to the host's BlueZ over D-Bus - privileged:
      # true above already covers the capability side of this.
      - /var/run/dbus:/var/run/dbus
      # pid: host makes /proc reflect the real host, but the container's
      # own /etc/ is still its own Alpine image - without this, metadata
      # reporting would say "Alpine Linux" instead of the host's real OS.
      - /etc/os-release:/host/etc/os-release:ro

  # user applications get added/removed/version-bumped here by OTA pushes:
  # vending-app:
  #   image: ghcr.io/you/vending-app:1.4.0
  #   restart: unless-stopped
  #   depends_on:
  #     - mqtt-bridge

  # See examples/edge-ai-face-detector/README.md - needs a real USB webcam at
  # /dev/video0 (not a Pi Camera Module/CSI camera, a different capture
  # path this example doesn't support) and a FaceSnapshot datastream +
  # Image widget created in the Blynk console first. Versioned and
  # published independently of this project's own stack version - see
  # examples/edge-ai-face-detector/VERSION and .github/workflows/build-edge-ai-face-detector.yml.
  # edge-ai-face-detector:
  #   image: ghcr.io/anthony-blynk/edge-ai-face-detector:1.0.1
  #   restart: unless-stopped
  #   depends_on:
  #     - mqtt-bridge
  #   devices:
  #     - "/dev/video0:/dev/video0"

  # See examples/usb-barcode-scanner/README.md - needs a USB barcode scanner
  # in keyboard-wedge mode, AGENT_GATEWAY_ENABLED=true above, and an entry
  # for this scanner in this device's AgentSubDeviceRegistry datastream (or
  # just plug it in - it'll auto-register itself with a placeholder token
  # pending configuration) under its own registered Blynk device (with a
  # BarcodeScanned datastream created first). Fill in SCANNER_DEVICE_PATH
  # (see `ls -l /dev/input/by-id/` on this host) and SUB_DEVICE_NAME below.
  # Versioned and published independently of this project's own stack
  # version - see examples/usb-barcode-scanner/VERSION and
  # .github/workflows/build-usb-barcode-scanner.yml.
  # usb-barcode-scanner:
  #   image: ghcr.io/anthony-blynk/usb-barcode-scanner:1.1.0
  #   restart: unless-stopped
  #   depends_on:
  #     - mqtt-bridge
  #   # Confirmed on real hardware: evdev's exclusive .grab() (EVIOCGRAB)
  #   # gets EPERM under Docker's default capability set even running as
  #   # root - a plain devices/volumes mapping alone isn't enough.
  #   privileged: true
  #   environment:
  #     - SCANNER_DEVICE_PATH=/dev/input/by-id/usb-YOUR_SCANNER_MODEL-event-kbd
  #     - SUB_DEVICE_NAME=your-scanner-name
  #   volumes:
  #     - /dev/input:/dev/input

  # See examples/atc-thermometer/README.md - needs AGENT_GATEWAY_ENABLED=true
  # above and a Blynk device/template (with Temperature/Humidity/Battery
  # datastreams) created per sensor - no per-sensor environment variables
  # here, every sensor in range auto-registers itself via its own MAC
  # address. Versioned and published independently of this project's own
  # stack version - see examples/atc-thermometer/VERSION and
  # .github/workflows/build-atc-thermometer.yml.
  # atc-thermometer:
  #   image: ghcr.io/anthony-blynk/atc-thermometer:1.0.0
  #   restart: unless-stopped
  #   depends_on:
  #     - mqtt-bridge
  #   # Talks to BlueZ over D-Bus, same mechanism the agent's own BLE
  #   # provisioning already uses - not yet confirmed on real hardware
  #   # whether this also needs privileged: true the way the barcode
  #   # scanner example's raw evdev access does, or whether the D-Bus
  #   # socket alone is enough.
  #   volumes:
  #     - /var/run/dbus:/var/run/dbus

volumes:
  mqtt_bridge_data:
  mqtt_bridge_log:
