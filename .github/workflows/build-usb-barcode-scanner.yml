name: Build and push usb-barcode-scanner example

# Deliberately its own workflow, not folded into build-and-push.yml: this
# example is versioned and released independently of the core agent/
# mqtt-bridge stack (see examples/usb-barcode-scanner/VERSION), so it should
# only rebuild when its own files change, not on every edge-agent commit.
on:
  push:
    branches: [master]
    paths:
      - "examples/usb-barcode-scanner/**"
      - ".github/workflows/build-usb-barcode-scanner.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Read example version
        id: version
        run: echo "version=$(cat examples/usb-barcode-scanner/VERSION)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push usb-barcode-scanner
        uses: docker/build-push-action@v5
        with:
          context: ./examples/usb-barcode-scanner
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/usb-barcode-scanner:latest
            ghcr.io/${{ github.repository_owner }}/usb-barcode-scanner:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
