name: Build and push edge-ai-face-detector example

# Deliberately its own workflow, not folded into build-and-push.yml: this
# example is versioned and released independently of the core agent/
# mqtt-bridge stack (see examples/edge-ai-face-detector/VERSION), so it should
# only rebuild when its own files change, not on every edge-agent commit.
on:
  push:
    branches: [master]
    paths:
      - "examples/edge-ai-face-detector/**"
      - ".github/workflows/build-edge-ai-face-detector.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Read example version
        id: version
        run: echo "version=$(cat examples/edge-ai-face-detector/VERSION)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push edge-ai-face-detector
        uses: docker/build-push-action@v5
        with:
          context: ./examples/edge-ai-face-detector
          # No linux/arm/v7 (unlike build-and-push.yml's agent/mqtt-bridge
          # images) - opencv-python-headless has no prebuilt wheel for
          # 32-bit ARM, so pip falls back to building it (and numpy) from
          # source there, which then fails without a build toolchain
          # (ninja) present. Every real device this project actually
          # targets (Pi 5, Jetson Orin, x86) is 64-bit anyway.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/edge-ai-face-detector:latest
            ghcr.io/${{ github.repository_owner }}/edge-ai-face-detector:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
