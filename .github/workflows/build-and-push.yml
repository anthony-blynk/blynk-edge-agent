name: Build and push images

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Read stack version
        id: version
        run: echo "version=$(grep -A1 'x-stack:' docker-compose.yml | grep version | sed -E 's/.*"(.*)".*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install unit test dependencies
        run: pip install -r agent/tests/requirements.txt

      - name: Run unit tests
        run: python -m pytest agent/tests -v

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A push to master with no version bump would otherwise silently
      # rebuild and overwrite whatever's already published under this exact
      # tag - happened for real on this project (a couple of small fixes
      # landed on master right after a release without bumping the
      # version). :latest is expected to move; a specific version tag is
      # supposed to mean "this exact content," so refuse to overwrite one.
      - name: Refuse to overwrite an already-published version tag
        run: |
          for image in blynk-agent blynk-mqtt-bridge; do
            tag="ghcr.io/${{ github.repository_owner }}/$image:${{ steps.version.outputs.version }}"
            if docker manifest inspect "$tag" > /dev/null 2>&1; then
              echo "::error::$tag already exists - bump x-stack.version (and both image tags) in docker-compose.yml before pushing to master."
              exit 1
            fi
          done

      - name: Build and push agent
        uses: docker/build-push-action@v5
        with:
          context: ./agent
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/blynk-agent:latest
            ghcr.io/${{ github.repository_owner }}/blynk-agent:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push mqtt-bridge
        uses: docker/build-push-action@v5
        with:
          context: ./mqtt-bridge
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/blynk-mqtt-bridge:latest
            ghcr.io/${{ github.repository_owner }}/blynk-mqtt-bridge:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
